 stroke-linecap="round"/><text x="24.0" y="406.0" textLength="390.5" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">붙임 두 건에 번호·부수를 붙이고 마지막에 &#x27;끝.&#x27;을 적어 세 부분을 갖췄다.</text><text x="24.0" y="426.0" textLength="717.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  본문부는 내용을 쓴 다음, 첨부할 자료가 있으면 붙임을 언급하고, 마지막으로 끝 표시를 적는 세 부분으로 이루어진다. 붙임은 번호와 부수를 붙여 적는다.</text></svg>