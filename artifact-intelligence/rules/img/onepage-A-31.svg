<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="56.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">한 장 보고서</text><text x="86.8" y="20.0" textLength="162.3" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 본문 글머리·위계 · 카드의 전·후 예</text><rect x="712.7" y="8.0" width="63.3" height="18.0" rx="9" fill="#fff" stroke="#267a68" stroke-width="1"/><text x="720.7" y="21.0" textLength="47.3" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#267a68">규칙대로 ✓</text><rect x="24.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="38.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#E75757" stroke="none" stroke-width="1"/><text x="47.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">전</text><text x="44.0" y="100.0" textLength="325.3" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">압축형 절 이름을 새로 지음: &#x27;주요현황&#x27;, &#x27;시사점&#x27;,</text><text x="44.0" y="126.0" textLength="68.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">&#x27;향후관리&#x27;</text><line x1="233.1" y1="105.3" x2="370.3" y2="105.3" stroke="#E75757" stroke-width="2.4" stroke-linecap="round"/><line x1="44.0" y1="131.3" x2="113.4" y2="131.3" stroke="#E75757" stroke-width="2.4" stroke-linecap="round"/><circle cx="121.4" cy="131.3" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="118.7" y="134.6" textLength="5.4" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">✗</text><text x="38.0" y="272.0" textLength="123.8" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#913F48">✗ 새로 지은 절 이름 3개</text><rect x="408.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="422.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#267a68" stroke="none" stroke-width="1"/><text x="431.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">후</text><text x="428.0" y="100.0" textLength="277.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">표준형과 같은 이름 사용: &#x27;주요현황·동향&#x27;,</text><text x="428.0" y="126.0" textLength="165.3" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">&#x27;영향·시사점&#x27;, &#x27;향후관리&#x27;</text><line x1="597.9" y1="105.3" x2="706.0" y2="105.3" stroke="#267a68" stroke-width="2.4" stroke-linecap="round"/><line x1="428.0" y1="131.3" x2="594.3" y2="131.3" stroke="#267a68" stroke-width="2.4" stroke-linecap="round"/><circle cx="602.3" cy="131.3" r="7" fill="#267a68" stroke="#fff" stroke-width="2"/><text x="597.6" y="134.6" textLength="9.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">○</text><text x="422.0" y="272.0" textLength="126.5" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#267a68">○ 표준형과 동일한 이름</text><text x="24.0" y="406.0" textLength="364.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">압축형에서도 절 이름을 표준형과 그대로 맞춰 핵심질문 연결을 지킴</text><text x="24.0" y="426.0" textLength="663.3" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  내용이 적어 절을 3개로 줄일 때도 남기는 절의 이름은 표준형(4개 절)과 똑같이 쓴다. 압축은 절을 새로 짓는 것이 아니라 하나를 빼는 것이다.</text></svg>