<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="63.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">발표 슬라이드</text><text x="93.8" y="20.0" textLength="253.8" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 본문 글머리·위계 · 표본 『전기차 충전소 확충 추진계획』</text><rect x="712.7" y="8.0" width="63.3" height="18.0" rx="9" fill="#fff" stroke="#267a68" stroke-width="1"/><text x="720.7" y="21.0" textLength="47.3" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#267a68">규칙대로 ✓</text><rect x="24.0" y="36.0" width="504.0" height="350.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><clipPath id="doc-slides-10"><rect x="24" y="36" width="504" height="350"/></clipPath><g clip-path="url(#doc-slides-10)"><text x="46.0" y="166.5" textLength="225.7" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:19px;font-weight:800;fill:#101B33;opacity:0.45">전기차 충전소 확충 추진계획</text><text x="46.0" y="198.5" textLength="368.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13.5px;font-weight:700;fill:#101B33">• &#x27;26년 상반기 충전 민원 214건 — 대기시간 41%·접근거리 27%</text><text x="62.0" y="222.9" textLength="214.1" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:400;fill:#101B33