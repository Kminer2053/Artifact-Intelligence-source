<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="56.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">한 장 보고서</text><text x="86.8" y="20.0" textLength="95.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 표 · 카드의 전·후 예</text><rect x="712.7" y="8.0" width="63.3" height="18.0" rx="9" fill="#fff" stroke="#267a68" stroke-width="1"/><text x="720.7" y="21.0" textLength="47.3" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#267a68">규칙대로 ✓</text><rect x="24.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="38.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#E75757" stroke="none" stroke-width="1"/><text x="47.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">전</text><text x="44.0" y="100.0" textLength="296.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">구축비용을 ○ 불릿으로 1안·2안과 동일 레벨</text><text x="44.0" y="126.0" textLength="29.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">처리</text><line x1="122.1" y1="105.3" x2="341.6" y2="105.3" stroke="#E75757" stroke-width="2.4" stroke-linecap="round"/><line x1="44.0" y1="131.3" x2="74.4" y2="131.3" stroke="#E75757" stroke-width="2.4" stroke-linecap="round"/><circle cx="82.4" cy="131.3" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="79.7" y="134.6" textLength="5.4" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">✗</text><text x="38.0" y="272.0" textLength="162.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#913F48">✗ 비교 속성이 대안과 동급 불릿</text><rect x="408.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="422.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#267a68" stroke="none" stroke-width="1"/><text x="431.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">후</text><text x="428.0" y="100.0" textLength="234.2" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">표의 세부항목으로 넣어 비교되도록</text><line x1="428.0" y1="105.3" x2="663.2" y2="105.3" stroke="#267a68" stroke-width="2.4" stroke-linecap="round"/><circle cx="671.2" cy="105.3" r="7" fill="#267a68" stroke="#fff" stroke-width="2"/><text x="666.5" y="108.6" textLength="9.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">○</text><text x="422.0" y="272.0" textLength="153.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#267a68">○ 표 세부항목으로 옮겨 비교</text><text x="24.0" y="406.0" textLength="466.2" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">구축비용처럼 비교되는 속성을 불릿 나열 대신 표의 행으로 옮겨 대안 간 대조를 살렸다.</text><text x="24.0" y="426.0" textLength="743.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  여러 대안을 비교하는 문서에서 비용·기간·성능처럼 서로 비교되는 속성은 본문에 ○ 불릿으로 나란히 나열하지 말고 표의 행으로 모아 한눈에 대조되게 한다.…</text></svg>