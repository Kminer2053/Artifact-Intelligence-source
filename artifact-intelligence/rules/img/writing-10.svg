<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="58.9" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">시행문(공문)</text><text x="88.9" y="20.0" textLength="128.9" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 문장 표현 · 카드의 전·후 예</text><rect x="712.7" y="8.0" width="63.3" height="18.0" rx="9" fill="#fff" stroke="#267a68" stroke-width="1"/><text x="720.7" y="21.0" textLength="47.3" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#267a68">규칙대로 ✓</text><rect x="24.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="38.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#E75757" stroke="none" stroke-width="1"/><text x="47.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">전</text><text x="44.0" y="100.0" textLength="92.8" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">검사 바랍니다</text><ellipse cx="90.4" cy="94.6" rx="51.4" ry="13.8" fill="none" stroke="#E75757" stroke-width="2.2" transform="rotate(-2 90.4 94.6)"/><circle cx="144.8" cy="80.8" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="142.1" y="84.1" textLength="5.4" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">✗</text><text x="38.0" y="272.0" textLength="109.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#913F48">✗ 목적어·조사 생략됨</text><rect x="408.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="422.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#267a68" stroke="none" stroke-width="1"/><text x="431.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">후</text><text x="428.0" y="100.0" textLength="170.9" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">검사를 받으시기 바랍니다</text><rect x="422.0" y="78.8" width="182.9" height="31.5" rx="6" fill="none" stroke="#267a68" stroke-width="1.8" stroke-dasharray="6 4"/><circle cx="610.9" cy="78.8" r="7" fill="#267a68" stroke="#fff" stroke-width="2"/><text x="606.1" y="82.1" textLength="9.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">○</text><text x="422.0" y="272.0" textLength="131.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#267a68">○ 목적어 &#x27;~를&#x27; 성분 완비</text><text x="24.0" y="406.0" textLength="470.8" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">&#x27;검사 바랍니다&#x27;에서 빠진 목적어와 조사를 &#x27;검사를 받으시기 바랍니다&#x27;로 채워 완비했다.</text><text x="24.0" y="426.0" textLength="401.3" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  시행문의 공손한 결문에서도 조사와 목적어를 빠뜨리지 않고 성분을 완비해서 쓴다.</text></svg>