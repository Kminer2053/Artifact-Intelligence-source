<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="58.9" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">시행문(공문)</text><text x="88.9" y="20.0" textLength="128.9" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 문장 표현 · 카드의 전·후 예</text><rect x="712.7" y="8.0" width="63.3" height="18.0" rx="9" fill="#fff" stroke="#267a68" stroke-width="1"/><text x="720.7" y="21.0" textLength="47.3" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#267a68">규칙대로 ✓</text><rect x="24.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="38.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#E75757" stroke="none" stroke-width="1"/><text x="47.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">전</text><text x="44.0" y="100.0" textLength="234.2" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">조속히 / 수령 / 송부 / 기(旣) / 익일</text><ellipse cx="66.1" cy="94.6" rx="27.1" ry="13.8" fill="none" stroke="#E75757" stroke-width="2.2" transform="rotate(-2 66.1 94.6)"/><circle cx="96.2" cy="80.8" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="93.4" y="84.1" textLength="5.4" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">✗</text><text x="38.0" y="272.0" textLength="109.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#913F48">✗ 상투 한자어 조속히</text><rect x="408.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="422.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#267a68" stroke="none" stroke-width="1"/><text x="431.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">후</text><text x="428.0" y="100.0" textLength="276.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">되도록 빨리 / 받음 / 보냄 / 이미 / 다음 날</text><ellipse cx="467.0" cy="94.6" rx="44.0" ry="13.8" fill="none" stroke="#267a68" stroke-width="2.2" transform="rotate(-2 467.0 94.6)"/><circle cx="514.1" cy="80.8" r="7" fill="#267a68" stroke="#fff" stroke-width="2"/><text x="509.3" y="84.1" textLength="9.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">○</text><text x="422.0" y="272.0" textLength="92.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#267a68">○ 쉬운 말로 순화</text><text x="24.0" y="406.0" textLength="303.8" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">한자어 &#x27;조속히·수령·송부·기·익일&#x27;을 쉬운 말로 순화했다.</text><text x="24.0" y="426.0" textLength="708.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  시행문에서 문장이 46자를 넘으면 1페이지 보고서처럼 명사형으로 압축하지 말고 문장을 나눠 쓴다. 어조는 완곡하게 쓰고(조속히 대신 되도록 빨리),…</text></svg>