KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">✗</text><text x="38.0" y="272.0" textLength="132.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#913F48">✗ 항목명만 나열한 라벨형</text><rect x="408.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="422.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#267a68" stroke="none" stroke-width="1"/><text x="431.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">후</text><text x="428.0" y="100.0" textLength="101.1" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">매출 17% 증가</text><ellipse cx="478.6" cy="94.6" rx="55.6" ry="13.8" fill="none" stroke="#267a68" stroke-width="2.2" transform="rotate(-2 478.6 94.6)"/><circle cx="537.1" cy="80.8" r="7" fill="#267a68" stroke="#fff" stroke-width="2"/><text x="532.4" y="84.1" textLength="9.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">○</text><text x="422.0" y="272.0" textLength="161.1" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#267a68">○ 결론(17%↑)을 담은 선언형</text><text x="24.0" y="406.0" textLength="490.5" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">라벨형 &#x27;2024 매출&#x27;을 결론이 드러나는 &#x27;매출 17% 증가&#x27;로 고쳐 선언문 제목 원칙을 지켰다.</text><text x="24.0" y="426.0" textLength="410.5" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  차트 제목은 결론을 담은 선언문으로 쓰고, 항목명만 다는 라벨형 제목은 쓰지 않는다.</text></svg>