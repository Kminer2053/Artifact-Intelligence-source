<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="56.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">한 장 보고서</text><text x="86.8" y="20.0" textLength="280.2" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 판정·유형 · 표본 『사옥 주차장 전기차 충전기 설치 방안 검토』</text><rect x="696.2" y="8.0" width="79.8" height="18.0" rx="9" fill="#fff" stroke="#5b6577" stroke-width="1"/><text x="704.2" y="21.0" textLength="63.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#5b6577">이 자리를 본다</text><rect x="24.0" y="36.0" width="504.0" height="350.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><clipPath id="doc-onepage-B-05"><rect x="24" y="36" width="504" height="350"/></clipPath><g clip-path="url(#doc-onepage-B-05)"><text x="111.5" y="97.1" textLength="329.1" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:19px;font-weight:800;fill:#101B33">사옥 주차장 전기차 충전기 설치 방안 검토</text><line x1="84.0" y1="121.5" x2="468.0" y2="121.5" stroke="#101B33" stroke-width="1.5" stroke-linecap="round"/><text x="217.6" y="139.0" textLength="116.9" lengthAdjust="spacing" xml:space="preserve" style="font-size:11.5px;font-weight:400;fill:#5b6577">&lt;시설관리처, &#x27;26. 8. 5.&gt;</text><rect x="46.0" y="149.4" width="460.0" height="37.0" rx="0" fill="#f8f9fb" stroke="#101B33" stroke-width="1.2"/><text x="60.0" y="178.4" textLength="