o Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#5b6577">무엇이 고려됐나</text><line x1="125.5" y1="228.6" x2="427.5" y2="228.6" stroke="#1E67F0" stroke-width="2.4" stroke-linecap="round"/><circle cx="435.5" cy="228.6" r="7" fill="#1E67F0" stroke="#fff" stroke-width="2"/><text x="432.7" y="231.9" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">1</text><circle cx="570.0" cy="78.0" r="7" fill="#1E67F0" stroke="#fff" stroke-width="2"/><text x="567.2" y="81.3" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">1</text><text x="586.0" y="83.0" textLength="111.2" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#101B33">18자 — 33자 한도 안</text><line x1="444.5" y1="228.6" x2="540.0" y2="228.6" stroke="#1E67F0" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="540.0" y1="228.6" x2="561.0" y2="78.0" stroke="#1E67F0" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><ellipse cx="259.3" cy="208.0" rx="25.2" ry="17.4" fill="none" stroke="#1E67F0" stroke-width="2.2" transform="rotate(-2 259.3 208.0)"/><circle cx="287.5" cy="190.6" r="7" fill="#1E67F0" stroke="#fff" stroke-width="2"/><text x="284.7" y="193.9" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">2</text><circle cx="570.0" cy="111.0" r="7" fill="#1E67F0" stroke="#fff" stroke-width="2"/><text x="567.2" y="114.3" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">2</text><text x="586.0" y="116.0" textLength="104.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#101B33">방향어(성격어) 포함</text><line x1="296.5" y1="190.6" x2="540.0" y2="190.6" stroke="#1E67F0" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="540.0" y1="190.6" x2="561.0" y2="111.0" stroke="#1E67F0" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><text x="24.0" y="406.0" textLength="440.1" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">표지 제목이 &#x27;절감&#x27;이라는 방향을 담고도 18자로 33자 한도 안에서 한 줄에 앉는다.</text><text x="24.0" y="426.0" textLength="739.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  표지 주제목은 한 줄에 담기게 쓰고 내용과 함께 방향(성격어)을 보여주는 표현을 포함한다. 여러 줄로 넘어가지 않게 하려면 띄어쓰기를 포함해 33자 이내로…</text></svg>