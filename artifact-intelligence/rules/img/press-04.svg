<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="40.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">보도자료</text><text x="70.5" y="20.0" textLength="128.9" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 제목·표지 · 카드의 전·후 예</text><rect x="712.7" y="8.0" width="63.3" height="18.0" rx="9" fill="#fff" stroke="#267a68" stroke-width="1"/><text x="720.7" y="21.0" textLength="47.3" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#267a68">규칙대로 ✓</text><rect x="24.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="38.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#E75757" stroke="none" stroke-width="1"/><text x="47.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">전</text><text x="44.0" y="100.0" textLength="26.8" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">- ~ -</text><ellipse cx="57.4" cy="94.6" rx="18.4" ry="13.8" fill="none" stroke="#E75757" stroke-width="2.2" transform="rotate(-2 57.4 94.6)"/><circle cx="78.8" cy="80.8" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="76.1" y="84.1" textLength="5.4" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">✗</text><text x="38.0" y="272.0" textLength="98.1" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#913F48">✗ 앞뒤 모두 붙임표</text><rect x="408.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="422.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#267a68" stroke="none" stroke-width="1"/><text x="431.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">후</text><text x="428.0" y="100.0" textLength="16.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">- ~</text><ellipse cx="436.3" cy="94.6" rx="13.3" ry="13.8" fill="none" stroke="#267a68" stroke-width="2.2" transform="rotate(-2 436.3 94.6)"/><circle cx="452.6" cy="80.8" r="7" fill="#267a68" stroke="#fff" stroke-width="2"/><text x="447.9" y="84.1" textLength="9.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">○</text><text x="422.0" y="272.0" textLength="107.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#267a68">○ 앞만 열고 안 닫음</text><text x="24.0" y="406.0" textLength="399.5" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">부제 앞에만 붙임표를 열고 뒤는 닫지 않아 실물 다수 관행(49%)을 따른다.</text><text x="24.0" y="426.0" textLength="749.7" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  부제는 제목 아래 붙임표(-)로 열어 기본으로 붙인다. 대부분(49%)은 앞쪽만 붙임표로 열고 뒤는 닫지 않으며, 앞뒤를 모두 붙임표로 두르는 표기는 소수(24%)…</text></svg>