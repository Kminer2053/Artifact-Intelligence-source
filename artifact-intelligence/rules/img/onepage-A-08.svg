<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="56.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">한 장 보고서</text><text x="86.8" y="20.0" textLength="128.9" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 판정·유형 · 카드의 전·후 예</text><rect x="712.7" y="8.0" width="63.3" height="18.0" rx="9" fill="#fff" stroke="#267a68" stroke-width="1"/><text x="720.7" y="21.0" textLength="47.3" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#267a68">규칙대로 ✓</text><rect x="24.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="38.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#E75757" stroke="none" stroke-width="1"/><text x="47.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">전</text><text x="44.0" y="100.0" textLength="308.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">구버전 표준시퀀스: &#x27;검토결과&#x27;(결론)를 첫 절에</text><text x="44.0" y="126.0" textLength="29.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">배치</text><ellipse cx="209.7" cy="94.6" rx="34.4" ry="13.8" fill="none" stroke="#E75757" stroke-width="2.2" transform="rotate(-2 209.7 94.6)"/><circle cx="247.2" cy="80.8" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="244.5" y="84.1" textLength="5.4" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">✗</text><text x="38.0" y="272.0" textLength="128.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#913F48">✗ 구버전: 결론 선행 배치</text><rect x="408.0" y="36.0" width="368.0" height="214.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><rect x="422.0" y="48.0" width="30.0" height="20.0" rx="3" fill="#267a68" stroke="none" stroke-width="1"/><text x="431.5" y="62.0" textLength="11.0" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12px;font-weight:700;fill:#fff">후</text><text x="428.0" y="100.0" textLength="112.3" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">정본 표준시퀀스:</text><text x="428.0" y="126.0" textLength="318.7" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">검토배경→대안검토→검토의견→향후계획(결론</text><text x="428.0" y="152.0" textLength="175.9" lengthAdjust="spacing" xml:space="preserve" style="font-size:16px;font-weight:500;fill:#101B33">은 &#x27;검토의견&#x27; 절에서 제시)</text><line x1="428.0" y1="131.3" x2="712.5" y2="131.3" stroke="#267a68" stroke-width="2.4" stroke-linecap="round"/><circle cx="720.5" cy="131.3" r="7" fill="#267a68" stroke="#fff" stroke-width="2"/><text x="715.8" y="134.6" textLength="9.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">○</text><text x="422.0" y="272.0" textLength="155.2" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#267a68">○ 정본: 배경→대안→의견 순</text><text x="24.0" y="406.0" textLength="498.8" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">결론(검토결과) 선행 대신 배경→대안검토→검토의견 순으로 바꾸고 결론은 검토의견에 둔다.</text><text x="24.0" y="426.0" textLength="751.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  &#x27;검토/검토 부탁/의견 주세요/~여부 검토/가부 판단&#x27;처럼 이미 있는 대안 중 상급자가 고르는 상황이면 검토배경→대안검토→검토의견→향후계획 순으로 쓴다.…</text></svg>