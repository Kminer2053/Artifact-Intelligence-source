<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="56.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">한 장 보고서</text><text x="86.8" y="20.0" textLength="358.5" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 그림·도식·차트 · 표본 『전기차 충전소 확충 추진계획』(발표 슬라이드에서 빌림)</text><rect x="696.2" y="8.0" width="79.8" height="18.0" rx="9" fill="#fff" stroke="#5b6577" stroke-width="1"/><text x="704.2" y="21.0" textLength="63.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#5b6577">이 자리를 본다</text><rect x="24.0" y="36.0" width="504.0" height="350.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><clipPath id="doc-data_elements-12"><rect x="24" y="36" width="504" height="350"/></clipPath><g clip-path="url(#doc-data_elements-12)"><text x="46.0" y="140.0" textLength="282.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;font-weight:800;fill:#1F3864">증설은 2단계로 나눠 대기와 공백을 함께 푼다</text><text x="46.0" y="170.0" textLength="80.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11.5px;font-weight:700;fill:#5b6577">충전소 확충 단계</text><rect x="46.0" y="184.0" width="112.0" height="58.0" rx="2" fill="#EEF3FF" stroke="#555" stroke-width="1.2"/><text x="60.3" y="206.0" textLength="83.4