ml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">2</text><text x="586.0" y="116.0" textLength="167.1" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#101B33">표 하단 굵은 테두리 자리(0.4㎜)</text><line x1="524.0" y1="283.2" x2="540.0" y2="283.2" stroke="#1E67F0" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="540.0" y1="283.2" x2="561.0" y2="111.0" stroke="#1E67F0" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><text x="24.0" y="406.0" textLength="528.8" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">머리 아래선과 표 테두리가 있는 자리이나, 실제 선 굵기 값은 이 텍스트 조각으로는 확인할 수 없다.</text><text x="24.0" y="426.0" textLength="742.6" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  표 테두리는 위아래 바깥선 0.4mm, 안쪽 격자선과 머리글 아래선은 0.12mm를 기본값으로 쓰고 실선으로 그린다. 겉 0.45mm나 머리선 0.3mm 같은 조합…</text></svg>