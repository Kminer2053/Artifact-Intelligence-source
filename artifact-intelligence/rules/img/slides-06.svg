<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="63.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">발표 슬라이드</text><text x="93.8" y="20.0" textLength="243.7" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 그림·도식·차트 · 표본 『전기차 충전소 확충 추진계획』</text><rect x="696.2" y="8.0" width="79.8" height="18.0" rx="9" fill="#fff" stroke="#5b6577" stroke-width="1"/><text x="704.2" y="21.0" textLength="63.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#5b6577">이 자리를 본다</text><rect x="24.0" y="36.0" width="504.0" height="350.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><clipPath id="doc-slides-06"><rect x="24" y="36" width="504" height="350"/></clipPath><g clip-path="url(#doc-slides-06)"><text x="46.0" y="140.0" textLength="282.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;font-weight:800;fill:#1F3864">증설은 2단계로 나눠 대기와 공백을 함께 푼다</text><text x="46.0" y="170.0" textLength="80.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11.5px;font-weight:700;fill:#5b6577">충전소 확충 단계</text><rect x="46.0" y="184.0" width="112.0" height="58.0" rx="2" fill="#EEF3FF" stroke="#555" stroke-width="1.2"/><text x="60.3" y="206.0" textLength="83.4" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12.5px;font-weight:700;fill:#101B33">주차장 전환 3곳</text><text x="74.7" y="226.0" textLength="54.5" lengthAdjust="spacing" xml:space="preserve" style="font-size:10px;font-weight:400;fill:#5b6577">1단계 &#x27;26.10</text><line x1="166.0" y1="213.0" x2="194.0" y2="213.0" stroke="#1F3864" stroke-width="1.5" stroke-linecap="round"/><polygon points="194.0,209.0 200.0,213.0 194.0,217.0" fill="#1F3864"/><text x="164.7" y="205.0" textLength="30.7" lengthAdjust="spacing" xml:space="preserve" style="font-size:8.5px;font-weight:500;fill:#1F3864">급속 8기</text><rect x="206.0" y="184.0" width="112.0" height="58.0" rx="2" fill="#EEF3FF" stroke="#555" stroke-width="1.2"/><text x="220.3" y="206.0" textLength="83.4" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12.5px;font-weight:700;fill:#101B33">공백 행정동 2곳</text><text x="237.5" y="226.0" textLength="49.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:10px;font-weight:400;fill:#5b6577">2단계 &#x27;27.3</text><line x1="326.0" y1="213.0" x2="354.0" y2="213.0" stroke="#1F3864" stroke-width="1.5" stroke-linecap="round"/><polygon points="354.0,209.0 360.0,213.0 354.0,217.0" fill="#1F3864"/><text x="324.7" y="205.0" textLength="30.7" lengthAdjust="spacing" xml:space="preserve" style="font-size:8.5px;font-weight:500;fill:#1F3864">급속 4기</text><rect x="366.0" y="184.0" width="112.0" height="58.0" rx="2" fill="#EEF3FF" stroke="#555" stroke-width="1.2"/><text x="385.8" y="206.0" textLength="72.5" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:12.5px;font-weight:700;fill:#101B33">수요 모니터링</text><text x="412.8" y="226.0" textLength="18.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:10px;font-weight:400;fill:#5b6577">상시</text><text x="46.0" y="271.0" textLength="308.5" lengthAdjust="spacing" xml:space="preserve" style="font-size:12px;font-weight:400;fill:#5b6577;font-style:italic">1단계로 피크 대기를, 2단계로 접근거리 공백을 순차 해소한다.</text><text x="46.0" y="296.0" textLength="125.3" lengthAdjust="spacing" xml:space="preserve" style="font-size:10.5px;font-weight:400;fill:#5b6577">출처: 공단 수요 모형(&#x27;26. 7.)</text></g><text x="560.0" y="50.0" textLength="73.9" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#5b6577">무엇이 고려됐나</text><ellipse cx="86.2" cy="166.0" rx="45.2" ry="12.0" fill="none" stroke="#1E67F0" stroke-width="2.2" transform="rotate(-2 86.2 166.0)"/><circle cx="134.5" cy="154.0" r="7" fill="#1E67F0" stroke="#fff" stroke-width="2"/><text x="131.7" y="157.3" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">1</text><circle cx="570.0" cy="78.0" r="7" fill="#1E67F0" stroke="#fff" stroke-width="2"/><text x="567.2" y="81.3" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">1</text><text x="586.0" y="83.0" textLength="114.2" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#101B33">제목뿐, 아이콘명 없음</text><line x1="143.5" y1="154.0" x2="540.0" y2="154.0" stroke="#1E67F0" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="540.0" y1="154.0" x2="561.0" y2="78.0" stroke="#1E67F0" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><rect x="43.0" y="181.0" wi