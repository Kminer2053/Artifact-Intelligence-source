<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" font-family="'Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif"><rect width="800" height="450" fill="#FFFFFF"/><text x="24.0" y="20.0" textLength="63.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#101B33">풀버전 보고서</text><text x="93.8" y="20.0" textLength="239.7" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">· 제목·표지 · 표본 『청사 에너지 절감 3개년 추진계획』</text><rect x="690.2" y="8.0" width="85.8" height="18.0" rx="9" fill="#fff" stroke="#913F48" stroke-width="1"/><text x="698.2" y="21.0" textLength="69.8" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:10.5px;font-weight:700;fill:#913F48">표본이 어긋남 ✗</text><rect x="24.0" y="36.0" width="504.0" height="350.0" rx="4" fill="#fff" stroke="#e7e9ee" stroke-width="1"/><clipPath id="doc-entities-04"><rect x="24" y="36" width="504" height="350"/></clipPath><g clip-path="url(#doc-entities-04)"><text x="224.5" y="182.3" textLength="103.0" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:400;fill:#5b6577">탄소중립 청사 운영</text><text x="125.5" y="215.5" textLength="300.9" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:22px;font-weight:800;fill:#101B33">청사 에너지 절감 3개년 추진계획</text><text x="191.3" y="246.6" textLength="169.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">2026. 6. 10. · ○○공사 · 시설관리처</text></g><text x="560.0" y="50.0" textLength="73.9" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:11px;font-weight:700;fill:#5b6577">무엇이 고려됐나</text><line x1="191.3" y1="253.7" x2="361.7" y2="253.7" stroke="#E75757" stroke-width="2.4" stroke-linecap="round"/><circle cx="369.7" cy="253.7" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="366.9" y="256.9" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">1</text><circle cx="570.0" cy="78.0" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="567.2" y="81.3" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">1</text><text x="586.0" y="83.0" textLength="136.1" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#101B33">✗ 꺾쇠 없이 가운뎃점 사용</text><line x1="378.7" y1="253.7" x2="540.0" y2="253.7" stroke="#E75757" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="540.0" y1="253.7" x2="561.0" y2="78.0" stroke="#E75757" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><ellipse cx="220.4" cy="242.9" rx="34.1" ry="10.7" fill="none" stroke="#E75757" stroke-width="2.2" transform="rotate(-2 220.4 242.9)"/><circle cx="257.4" cy="232.2" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="254.6" y="235.5" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">2</text><circle cx="570.0" cy="111.0" r="7" fill="#E75757" stroke="#fff" stroke-width="2"/><text x="567.2" y="114.3" textLength="5.6" lengthAdjust="spacing" xml:space="preserve" style="font-family:'Noto Sans KR Display','Noto Sans KR','Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.5px;font-weight:700;fill:#fff">2</text><text x="586.0" y="116.0" textLength="126.4" lengthAdjust="spacing" xml:space="preserve" style="font-size:12.5px;font-weight:500;fill:#101B33">✗ 연도 전체 &#x27;2026.&#x27;표기</text><line x1="266.4" y1="232.2" x2="540.0" y2="232.2" stroke="#E75757" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><line x1="540.0" y1="232.2" x2="561.0" y2="111.0" stroke="#E75757" stroke-width="1" stroke-dasharray="3 3" stroke-linecap="round"/><text x="24.0" y="406.0" textLength="367.9" lengthAdjust="spacing" xml:space="preserve" style="font-size:13px;font-weight:500;fill:#101B33">부서명·일자를 꺾쇠 없이 가운뎃점으로만 나열해 규범 형식을 어겼다.</text><text x="24.0" y="426.0" textLength="745.3" lengthAdjust="spacing" xml:space="preserve" style="font-size:11px;font-weight:400;fill:#5b6577">규칙  작성 부서와 작성일을 &lt;부서명, &#x27;26. 7. 25.&gt; 형식으로 꺾쇠 안에 적는다. 부서명은 약칭 없이 정식 명칭을 쓴다. 한 장 보고서는 제목 바로 아래에, 여러 장짜리…</text></svg>